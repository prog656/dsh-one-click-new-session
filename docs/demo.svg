<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="920" height="420" fill="#f6f8fb"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#1b1f24">One click, no workspace picker</text>
  <text x="30" y="60" font-size="13" fill="#5b6472">Schematic — the button is independent of the workspace you are currently in.</text>

  <!-- Arrow -->
  <g>
    <rect x="436" y="196" width="48" height="34" rx="17" fill="#e8f0ff"/>
    <path d="M450 213h22m-8-7 8 7-8 7" stroke="#3a7bff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- BEFORE panel -->
  <g>
    <rect x="30" y="86" width="386" height="290" rx="12" fill="#ffffff" stroke="#dfe4ec"/>
    <rect x="30" y="86" width="386" height="34" rx="12" fill="#eef1f6"/>
    <rect x="30" y="108" width="386" height="12" fill="#eef1f6"/>
    <circle cx="48" cy="103" r="4" fill="#ff6b6b"/><circle cx="62" cy="103" r="4" fill="#ffc857"/><circle cx="76" cy="103" r="4" fill="#5dd39e"/>
    <text x="96" y="108" font-size="12" font-weight="600" fill="#4a5361">BEFORE · inside a project</text>

    <!-- sidebar -->
    <rect x="30" y="120" width="126" height="256" fill="#f1f3f7"/>
    <text x="44" y="146" font-size="11" font-weight="700" fill="#8b94a3">WORKSPACES</text>
    <rect x="38" y="158" width="110" height="24" rx="5" fill="#dfe9ff"/>
    <text x="48" y="174" font-size="11" fill="#2f5fc4">campus_market</text>
    <text x="48" y="200" font-size="11" fill="#5b6472">thesis</text>
    <text x="48" y="224" font-size="11" fill="#5b6472">skin-center</text>
    <line x1="38" y1="330" x2="148" y2="330" stroke="#d9dee7"/>
    <!-- highlighted button -->
    <rect x="38" y="338" width="110" height="28" rx="6" fill="#3a7bff"/>
    <path d="M50 352h10m-5-5v10" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <text x="66" y="356" font-size="11" font-weight="600" fill="#ffffff">New chat</text>

    <!-- main area -->
    <text x="176" y="150" font-size="11" fill="#8b94a3">CURRENT SESSION</text>
    <rect x="176" y="162" width="222" height="26" rx="6" fill="#eef1f6"/>
    <text x="186" y="179" font-size="11" fill="#4a5361">Refactor the login flow...</text>
    <rect x="176" y="198" width="180" height="26" rx="6" fill="#f4f6fa"/>
    <text x="186" y="215" font-size="11" fill="#4a5361">Done, here is the diff.</text>
    <rect x="176" y="308" width="222" height="46" rx="8" fill="#fafbfd" stroke="#dfe4ec"/>
    <text x="188" y="335" font-size="11" fill="#9aa3b1">Message in this project...</text>
  </g>

  <!-- AFTER panel -->
  <g>
    <rect x="504" y="86" width="386" height="290" rx="12" fill="#ffffff" stroke="#dfe4ec"/>
    <rect x="504" y="86" width="386" height="34" rx="12" fill="#eef1f6"/>
    <rect x="504" y="108" width="386" height="12" fill="#eef1f6"/>
    <circle cx="522" cy="103" r="4" fill="#ff6b6b"/><circle cx="536" cy="103" r="4" fill="#ffc857"/><circle cx="550" cy="103" r="4" fill="#5dd39e"/>
    <text x="570" y="108" font-size="12" font-weight="600" fill="#4a5361">AFTER · one click</text>

    <rect x="504" y="120" width="126" height="256" fill="#f1f3f7"/>
    <text x="518" y="146" font-size="11" font-weight="700" fill="#8b94a3">WORKSPACES</text>
    <text x="518" y="172" font-size="11" fill="#5b6472">campus_market</text>
    <text x="518" y="196" font-size="11" fill="#5b6472">thesis</text>
    <text x="518" y="220" font-size="11" fill="#5b6472">skin-center</text>
    <line x1="512" y1="238" x2="622" y2="238" stroke="#d9dee7"/>
    <text x="518" y="258" font-size="11" font-weight="700" fill="#3a7bff">Quick Chats</text>
    <rect x="512" y="266" width="110" height="24" rx="5" fill="#dfe9ff"/>
    <text x="522" y="282" font-size="11" fill="#2f5fc4">New conversation</text>
    <line x1="512" y1="330" x2="622" y2="330" stroke="#d9dee7"/>
    <rect x="512" y="338" width="110" height="28" rx="6" fill="#ffffff" stroke="#3a7bff"/>
    <path d="M524 352h10m-5-5v10" stroke="#3a7bff" stroke-width="1.8" stroke-linecap="round"/>
    <text x="540" y="356" font-size="11" font-weight="600" fill="#3a7bff">New chat</text>

    <!-- empty conversation -->
    <circle cx="712" cy="210" r="20" fill="#e8f0ff"/>
    <path d="M704 210h16m-8-8v16" stroke="#3a7bff" stroke-width="2" stroke-linecap="round"/>
    <text x="672" y="252" font-size="13" font-weight="600" fill="#4a5361">A brand new blank chat</text>
    <text x="668" y="272" font-size="11" fill="#8b94a3">No workspace picker shown</text>
    <rect x="650" y="308" width="222" height="46" rx="8" fill="#ffffff" stroke="#3a7bff" stroke-width="1.6"/>
    <text x="662" y="335" font-size="11" fill="#6b7484">Type here — enabled ✓</text>
  </g>

  <text x="30" y="400" font-size="12" fill="#8b94a3">Verified end-to-end through CDP: button renders → session opens → composer is enabled → session persists to disk.</text>
</svg>
